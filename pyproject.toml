[project]
name = "seismic-attention"
version = "0.1.0"
description = "Live monitoring of online reaction to M4.5+ earthquakes with media-coverage prediction."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbstripout>=0.9.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyspark==3.5.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "river>=0.27.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
