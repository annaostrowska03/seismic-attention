name: seismic-attention

# Base stack: Kafka (KRaft), HDFS, Hive, Spark, NiFi, PostgreSQL.
# Setup guide: docs/SETUP.md. Local development only - no auth, no TLS.

x-hadoop-build: &hadoop-build
  context: ./docker/hadoop
  args:
    HADOOP_VERSION: ${HADOOP_VERSION:-3.4.1}

x-spark-common: &spark-common
  image: apache/spark:${SPARK_VERSION:-3.5.3}-python3
  user: root
  restart: unless-stopped
  volumes:
    - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./src:/opt/app/src:ro
    - ./scripts:/opt/app/scripts:ro
    - ./data:/opt/app/data
    - spark_ivy:/root/.ivy2

services:
  # ---------- PostgreSQL: Hive metastore DB + serving layer ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seismic
      POSTGRES_PASSWORD: seismic
      POSTGRES_DB: seismic
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seismic -d seismic"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Kafka (single node, KRaft, no ZooKeeper) ----------
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.8.0}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # kafka:9092 inside Docker, localhost:29092 from the host
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-3.8.0}
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in usgs bsky gdelt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  # ---------- HDFS ----------
  namenode:
    build: *hadoop-build
    image: seismic-hadoop:${HADOOP_VERSION:-3.4.1}
    hostname: namenode
    restart: unless-stopped
    command:
      - sh
      - -c
      - "[ -d /hadoop/dfs/name/current ] || hdfs namenode -format -nonInteractive; exec hdfs namenode"
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    ports:
      - "${NAMENODE_UI_PORT:-9870}:9870"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  datanode:
    build: *hadoop-build
    image: seismic-hadoop:${HADOOP_VERSION:-3.4.1}
    hostname: datanode
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode_data:/hadoop/dfs/data
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Creates the HDFS directory layout once the cluster is up.
  hdfs-init:
    build: *hadoop-build
    image: seismic-hadoop:${HADOOP_VERSION:-3.4.1}
    restart: "no"
    depends_on:
      datanode:
        condition: service_healthy
    volumes:
      - ./conf/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command:
      - sh
      - -c
      - |
        hdfs dfsadmin -safemode wait &&
        hdfs dfs -mkdir -p /raw/usgs /raw/bsky /raw/gdelt /history /checkpoints /tmp/hive /user/hive/warehouse &&
        hdfs dfs -chmod -R 777 /raw /history /checkpoints /tmp /user

  # ---------- Hive (metastore on PostgreSQL + HiveServer2) ----------
  hive-metastore:
    build: ./docker/hive
    image: seismic-hive:${HIVE_VERSION:-4.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9083'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  hiveserver2:
    build: ./docker/hive
    image: seismic-hive:${HIVE_VERSION:-4.0.0}
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true" # schema is initialised by the metastore container
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "${HIVESERVER2_PORT:-10000}:10000"
      - "${HIVESERVER2_UI_PORT:-10002}:10002"
    volumes:
      - ./data:/opt/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/10000'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ---------- Spark (standalone cluster) ----------
  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    ports:
      - "${SPARK_MASTER_UI_PORT:-8090}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "4040:4040" # driver UI of a job running on the master container

  spark-worker:
    <<: *spark-common
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-2g}"
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_UI_PORT:-8091}:8081"

  # ---------- NiFi ----------
  nifi:
    image: apache/nifi:${NIFI_VERSION:-1.28.0}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
    environment:
      NIFI_WEB_HTTP_HOST: 0.0.0.0
      NIFI_WEB_HTTP_PORT: "8080"
      NIFI_SENSITIVE_PROPS_KEY: seismic-attention-dev-key
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    ports:
      - "${NIFI_PORT:-8080}:8080"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      # Config files for the PutHDFS processor: /opt/nifi/hadoop-conf/core-site.xml,/opt/nifi/hadoop-conf/hdfs-site.xml
      - ./conf/hadoop:/opt/nifi/hadoop-conf:ro
      # Local source files read by ListFile/FetchFile (e.g. /opt/app/data/raw/bsky)
      - ./data:/opt/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  postgres_data:
  kafka_data:
  namenode_data:
  datanode_data:
  spark_ivy:
  nifi_conf:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
